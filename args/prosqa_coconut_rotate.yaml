# need 4 gpus

project: coconut
save_path: models
name: prosqa-coconut-rotate

only_eval: False

coconut: True
cot: False
no_thoughts: False
no_cot: False

c_thought: 1
epochs_per_stage: 5
max_latent_stage: 6
pad_latent_to_max: True

save_only_improve: False
uniform_prob: 0.0
model_id: openai-community/gpt2
load_model_path: None
seed: 0
resume: 0
bf16: False
train_path: data/prosqa_train.json
val_path: data/prosqa_valid.json
reset_optimizer: True
batch_size_training: 32
debug: False
gradient_accumulation_steps: 1
num_epochs: 50
lr: !!float "1e-4"
# Optional split learning rates (used when fine-tuning both modules together).
lr_base_llm: !!float "5e-5"
lr_projection_mlp: !!float "2e-4"
weight_decay: 0.01

use_kge: True
kge_artifact_root: data/prosqa_rotate
kge_entity_embeddings_file: entity_embeddings.pt
kge_relation_embeddings_file: relation_embeddings.pt
kge_entity_to_id_file: entity_to_id.json
kge_metadata_file: metadata.json
kge_anchor_policy: query_anchors
kge_projector_hidden: 768
kge_projector_num_hidden_layers: 2
kge_projector_activation: gelu
kge_projector_layernorm: True
align_loss_weight: 0.05
latent_injection: residual
freeze_base_llm: True
lr_scheduler: cosine
lr_warmup_ratio: 0.1
max_grad_norm: 1.0
wandb_log_group_grad_norm: False
wandb_log_group_param_norm: False
wandb_group_norm_log_interval: 50
wandb_log_training_data: False
